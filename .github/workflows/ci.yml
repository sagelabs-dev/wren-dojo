name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Wren tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install wren-console (Wren runtime)
        run: |
          curl -sL -o /tmp/wren-console.tar.gz \
            https://github.com/joshgoebel/wren-console/releases/download/v0.3.1/wren-console-v0.3.1-linux.tar.gz
          mkdir -p /tmp/wren-console
          tar xzf /tmp/wren-console.tar.gz -C /tmp/wren-console
          chmod +x /tmp/wren-console/bin/wrenc
          echo "/tmp/wren-console/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        run: |
          fail=0
          for t in test/test_*.wren; do
            echo "── $t"
            if ! wrenc "$t"; then fail=1; fi
          done
          exit $fail
